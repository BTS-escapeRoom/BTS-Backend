name: Build & Deploy

on:
  pull_request:
  push:
    branches:
      - dev
      - CICD

jobs:
  push_container:
    name: Push Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set repository and project name as environment variables
        run: |
          echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' > repository
          REPO_NAME=$(cat repository)
          echo "repository=$REPO_NAME" >> $GITHUB_ENV
          PROJ_NAME=$(basename $REPO_NAME)
          echo "project=$PROJ_NAME" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ env.repository }}:${{ github.sha }}

  deploy-to-workstation:
    name: Deploy to Workstation
    runs-on: ubuntu-latest
    needs: push_container
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WORKSTATION_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.WORKSTATION_ADDR }} >> ~/.ssh/known_hosts

      - name: Pull Docker image
        run: |
          export DOCKER_HOST=ssh://${{ secrets.WORKSTATION_USER }}@${{ secrets.WORKSTATION_ADDR }}
          docker pull ghcr.io/${{ env.repository }}:${{ github.sha }}

      - name: Clean up old containers
        run: |
          export DOCKER_HOST=ssh://${{ secrets.WORKSTATION_USER }}@${{ secrets.WORKSTATION_ADDR }}
          if [ "$(docker ps -aq -f name=${{ env.project }})" ]; then
            docker stop ${{ env.project }} || true
            docker rm ${{ env.project }} || true
          fi

      - name: Run new container
        run: |
          export DOCKER_HOST=ssh://${{ secrets.WORKSTATION_USER }}@${{ secrets.WORKSTATION_ADDR }}
          docker run -d --name ${{ env.project }} -p 8881:8080 ghcr.io/${{ env.repository }}:${{ github.sha }}

      - name: Deploy using docker-compose
        run: |
          scp docker-compose.yml ${{ secrets.WORKSTATION_USER }}@${{ secrets.WORKSTATION_ADDR }}:/path/to/deploy
          ssh ${{ secrets.WORKSTATION_USER }}@${{ secrets.WORKSTATION_ADDR }} "cd /path/to/deploy && docker-compose up -d"
