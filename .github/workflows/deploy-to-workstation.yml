name: Build & Deploy

on:
  pull_request:
  push:
    branches:
      - dev
      - CICD

jobs:
  push_container:
    name: Push Container
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    container:
      image: ubuntu:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: touch ./src/main/resources/application.properties
      - run: echo "${{ secrets.PROPERTIES }}" > ./src/main/resources/application.properties
      - run: cat ./src/main/resources/application.properties

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y docker.io



      - name: login to ghcr
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: upper to lower
        id: upper-to-lower
        run: |
          echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]' > repository
          REPO_NAME=$(cat repository)
          echo "repository=$REPO_NAME" >> $GITHUB_ENV
          

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ env.repository }}:latest