name: Build and Deploy

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      run_migration:
        description: "RDS 덤프를 PaaS MySQL로 적재하는 일회용 db-migrate 사이드카 포함 여부"
        type: boolean
        default: false
      migration_image:
        description: "마이그레이션 이미지 (GHCR private)"
        type: string
        default: "ghcr.io/bts-escaperoom/bts-migrate:latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
      IMAGE_DIGEST: ${{ steps.digest.outputs.IMAGE_DIGEST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }} \
            .

      - name: Login to GitHub Container Registry for Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Get Image Digest
        id: digest
        run: |
          IMAGE="ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"

          echo "IMAGE_DIGEST=ghcr.io/bts-escaperoom/bts-backend@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed image: $IMAGE"
          echo "Digest image: ghcr.io/bts-escaperoom/bts-backend@$DIGEST"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GHCR pull token
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.IMAGE_DIGEST }}
        run: |
          if [ -z "$GHCR_PULL_USERNAME" ]; then
            echo "GHCR_PULL_USERNAME is empty"
            exit 1
          fi

          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN is empty"
            exit 1
          fi

          echo "$GHCR_PULL_TOKEN" \
          | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin

          docker pull "$IMAGE_DIGEST"

      - name: Create production deploy compose
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.IMAGE_DIGEST }}

          RUN_MIGRATION: ${{ github.event.inputs.run_migration }}
          MIGRATION_IMAGE: ${{ github.event.inputs.migration_image }}

          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}

          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}

          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap
          from pathlib import Path

          required = [
              "IMAGE_DIGEST",

              "DB_NAME",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_ROOT_PASSWORD",

              "JWT_SECRET_KEY",

              "KAKAO_CLIENT_ID",
              "KAKAO_APP_ID",
              "KAKAO_CLIENT_SECRET",
              "KAKAO_REDIRECT_URI",
              "KAKAO_ADMIN_KEY",

              "NAVER_CLIENT_ID",
              "NAVER_CLIENT_SECRET",
              "NAVER_REDIRECT_URI",

              "APPLE_CLIENT_ID",
              "APPLE_REDIRECT_URI",
              "APPLE_TEAM_ID",
              "APPLE_KEY_ID",
              "APPLE_BUNDLE_ID",
              "APPLE_PRIVATE_KEY",
          ]

          for key in required:
              if not os.environ.get(key):
                  raise SystemExit(f"{key} is empty")

          image_digest = os.environ["IMAGE_DIGEST"]

          db_name = os.environ["DB_NAME"]
          db_username = os.environ["DB_USERNAME"]
          db_password = os.environ["DB_PASSWORD"]
          db_root_password = os.environ["DB_ROOT_PASSWORD"]

          if db_username.lower() == "root":
              raise SystemExit("DB_USERNAME must not be root. Use a normal user such as bts or app_user.")

          datasource_url = (
              f"jdbc:mysql://mysql:3306/{db_name}"
              "?useSSL=false"
              "&allowPublicKeyRetrieval=true"
              "&serverTimezone=Asia/Seoul"
              "&characterEncoding=UTF-8"
          )

          def yq(value: str) -> str:
              return json.dumps(value, ensure_ascii=False)

          compose = textwrap.dedent(f"""\
          services:
            edge:
              image: nginx:1.27-alpine
              restart: always
              expose:
                - "80"
              depends_on:
                - bts-backend
              command:
                - /bin/sh
                - -c
                - |
                  cat > /etc/nginx/conf.d/default.conf <<'EOF'
                  server {{
                    listen 80 default_server;
                    server_name _;

                    location / {{
                      proxy_pass http://bts-backend:8080;
                      proxy_http_version 1.1;

                      proxy_set_header Host apis.bangtal-boys.com;
                      proxy_set_header X-Forwarded-Host apis.bangtal-boys.com;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header X-Forwarded-Port 443;
                      proxy_set_header X-Real-IP $$remote_addr;
                      proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    }}
                  }}
                  EOF

                  nginx -g 'daemon off;'

            bts-backend:
              image: {image_digest}
              restart: always
              expose:
                - "8080"
              depends_on:
                - mysql
              environment:
                SERVER_PORT: "8080"
                SPRING_PROFILES_ACTIVE: "prd"

                SPRING_DATASOURCE_URL: {yq(datasource_url)}
                SPRING_DATASOURCE_USERNAME: {yq(db_username)}
                SPRING_DATASOURCE_PASSWORD: {yq(db_password)}
                SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "0"

                JWT_SECRET_KEY: {yq(os.environ["JWT_SECRET_KEY"])}

                KAKAO_CLIENT_ID: {yq(os.environ["KAKAO_CLIENT_ID"])}
                KAKAO_APP_ID: {yq(os.environ["KAKAO_APP_ID"])}
                KAKAO_CLIENT_SECRET: {yq(os.environ["KAKAO_CLIENT_SECRET"])}
                KAKAO_REDIRECT_URI: {yq(os.environ["KAKAO_REDIRECT_URI"])}
                KAKAO_ADMIN_KEY: {yq(os.environ["KAKAO_ADMIN_KEY"])}

                NAVER_CLIENT_ID: {yq(os.environ["NAVER_CLIENT_ID"])}
                NAVER_CLIENT_SECRET: {yq(os.environ["NAVER_CLIENT_SECRET"])}
                NAVER_REDIRECT_URI: {yq(os.environ["NAVER_REDIRECT_URI"])}

                APPLE_CLIENT_ID: {yq(os.environ["APPLE_CLIENT_ID"])}
                APPLE_REDIRECT_URI: {yq(os.environ["APPLE_REDIRECT_URI"])}
                APPLE_TEAM_ID: {yq(os.environ["APPLE_TEAM_ID"])}
                APPLE_KEY_ID: {yq(os.environ["APPLE_KEY_ID"])}
                APPLE_BUNDLE_ID: {yq(os.environ["APPLE_BUNDLE_ID"])}
                APPLE_PRIVATE_KEY: {yq(os.environ["APPLE_PRIVATE_KEY"])}

            mysql:
              image: ghcr.io/bts-escaperoom/bts-migrate:mysql-seed1
              restart: always
              x-deploy:
                stateful: true
              environment:
                MYSQL_DATABASE: {yq(db_name)}
                MYSQL_USER: {yq(db_username)}
                MYSQL_PASSWORD: {yq(db_password)}
                MYSQL_ROOT_PASSWORD: {yq(db_root_password)}
                TZ: "Asia/Seoul"
              command:
                - --character-set-server=utf8mb4
                - --collation-server=utf8mb4_unicode_ci
                - --default-time-zone=+09:00
              volumes:
                - mysql-data-m1:/var/lib/mysql

          volumes:
            mysql-data-m1:
          """)

          # 일회용 데이터 마이그레이션 사이드카 (workflow_dispatch 에서 run_migration=true 일 때만).
          # /health 는 DB 비의존이라 이 사이드카의 성패는 배포(롤백) 성패와 무관하다.
          if os.environ.get("RUN_MIGRATION") == "true":
              migration_image = os.environ.get("MIGRATION_IMAGE")
              if not migration_image:
                  raise SystemExit("RUN_MIGRATION=true 이지만 MIGRATION_IMAGE 가 비어 있습니다.")

              migration_service = textwrap.dedent(f"""\
              db-migrate:
                image: {migration_image}
                restart: "no"
                depends_on:
                  - mysql
                environment:
                  MYSQL_HOST: "mysql"
                  MYSQL_PORT: "3306"
                  MYSQL_DATABASE: {yq(db_name)}
                  MYSQL_ROOT_PASSWORD: {yq(db_root_password)}
              """)

              # 로더가 성공적으로 끝나야 bts-backend 가 뜨도록 묶는다.
              # -> 로더 실패 시 배포가 실패하며 컨테이너 로그가 노출되어 원인 파악이 가능.
              #    db-migrate 블록을 붙이기 전에 치환하므로 아래 depends_on 은 bts-backend 것만 매칭된다.
              old_dep = "    depends_on:\n      - mysql\n"
              new_dep = (
                  "    depends_on:\n"
                  "      mysql:\n"
                  "        condition: service_started\n"
                  "      db-migrate:\n"
                  "        condition: service_completed_successfully\n"
              )
              compose = compose.replace(old_dep, new_dep, 1)

              block = textwrap.indent(migration_service, "  ")
              compose = compose.replace("\nvolumes:\n", "\n" + block + "\nvolumes:\n", 1)
              print("db-migrate 사이드카 포함 (run_migration=true) + bts-backend 가 db-migrate 완료를 대기")

          Path("docker-compose.deploy.yml").write_text(compose)

          masked = compose
          for key in required:
              value = os.environ.get(key)
              if value:
                  masked = masked.replace(value, "***")

          print(masked)
          PY

      - name: Deploy to PaaS
        timeout-minutes: 5
        uses: JangHanbin/paas-deploy-action@v1
        with:
          app: bangtal-boys
          token: ${{ secrets.PAAS_DEPLOY_TOKEN }}
          deploy-yaml: docker-compose.deploy.yml
          images: >-
            {"bts-backend":"${{ needs.build.outputs.IMAGE_DIGEST }}"}
          http-service: edge
          http-port: "80"
          health-path: /health
          registry-host: ghcr.io
          registry-username: ${{ secrets.GHCR_PULL_USERNAME }}
          registry-password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Print App URL
        if: always()
        run: |
          echo "App URL:"
          echo "https://bangtal-boys-apps.free4me.cc"