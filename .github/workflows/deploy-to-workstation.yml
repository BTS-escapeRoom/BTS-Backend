name: Deploy to EC2 (Use built image)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1) Build & push Docker image to GHCR
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/bts-escaperoom/bts-backend:latest .

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker Image
        run: docker push ghcr.io/bts-escaperoom/bts-backend:latest

      # 2) Deploy to EC2 by pulling "latest"
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            echo "IMAGE_TAG=latest" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            docker-compose pull
            docker-compose up -d
