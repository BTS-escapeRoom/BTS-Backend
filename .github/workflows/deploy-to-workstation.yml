name: Build and Deploy

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
      IMAGE_DIGEST: ${{ steps.digest.outputs.IMAGE_DIGEST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }} \
            .

      - name: Login to GitHub Container Registry for Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Get Image Digest
        id: digest
        run: |
          IMAGE="ghcr.io/bts-escaperoom/bts-backend:${{ steps.vars.outputs.IMAGE_TAG }}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"

          echo "IMAGE_DIGEST=ghcr.io/bts-escaperoom/bts-backend@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed image: $IMAGE"
          echo "Digest image: ghcr.io/bts-escaperoom/bts-backend@$DIGEST"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GHCR pull token
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.IMAGE_DIGEST }}
        run: |
          if [ -z "$GHCR_PULL_USERNAME" ]; then
            echo "GHCR_PULL_USERNAME is empty"
            exit 1
          fi

          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN is empty"
            exit 1
          fi

          echo "$GHCR_PULL_TOKEN" \
          | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin

          docker pull "$IMAGE_DIGEST"

      - name: Create production deploy compose
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.IMAGE_DIGEST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap
          from pathlib import Path

          required = [
              "IMAGE_DIGEST",
              "DB_NAME",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_ROOT_PASSWORD",
          ]

          for key in required:
              if not os.environ.get(key):
                  raise SystemExit(f"{key} is empty")

          image_digest = os.environ["IMAGE_DIGEST"]
          db_name = os.environ["DB_NAME"]
          db_username = os.environ["DB_USERNAME"]
          db_password = os.environ["DB_PASSWORD"]
          db_root_password = os.environ["DB_ROOT_PASSWORD"]

          datasource_url = (
              f"jdbc:mysql://mysql:3306/{db_name}"
              "?useSSL=false"
              "&allowPublicKeyRetrieval=true"
              "&serverTimezone=Asia/Seoul"
              "&characterEncoding=UTF-8"
          )

          def yq(value: str) -> str:
              return json.dumps(value, ensure_ascii=False)

          compose = textwrap.dedent(f"""\
          services:
            bts-backend:
              image: {image_digest}
              restart: always
              expose:
                - "8080"
              environment:
                SPRING_DATASOURCE_URL: {yq(datasource_url)}
                SPRING_DATASOURCE_USERNAME: {yq(db_username)}
                SPRING_DATASOURCE_PASSWORD: {yq(db_password)}
                SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "0"

            mysql:
              image: mysql:8.0
              restart: always
              x-deploy:
                stateful: true
              environment:
                MYSQL_DATABASE: {yq(db_name)}
                MYSQL_USER: {yq(db_username)}
                MYSQL_PASSWORD: {yq(db_password)}
                MYSQL_ROOT_PASSWORD: {yq(db_root_password)}
                TZ: "Asia/Seoul"
              command:
                - --character-set-server=utf8mb4
                - --collation-server=utf8mb4_unicode_ci
                - --default-time-zone=+09:00
              volumes:
                - mysql-data:/var/lib/mysql

          volumes:
            mysql-data:
          """)

          Path("docker-compose.deploy.yml").write_text(compose)

          masked = compose
          masked = masked.replace(db_password, "***")
          masked = masked.replace(db_root_password, "***")
          print(masked)
          PY

      - name: Deploy to PaaS
        uses: JangHanbin/paas-deploy-action@v1
        with:
          app: bangtal-boys
          token: ${{ secrets.PAAS_DEPLOY_TOKEN }}
          deploy-yaml: docker-compose.deploy.yml
          images: >-
            {"bts-backend":"${{ needs.build.outputs.IMAGE_DIGEST }}"}
          http-service: bts-backend
          http-port: "8080"
          health-path: /health
          registry-host: ghcr.io
          registry-username: ${{ secrets.GHCR_PULL_USERNAME }}
          registry-password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Print App URL
        if: always()
        run: |
          echo "App URL:"
          echo "https://bangtal-boys-apps.free4me.cc"