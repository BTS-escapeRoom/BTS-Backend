      SPRING_SECURITY_JWT_SECRET-KEY: 37e5e6213096155c93ce0d832fc2f1f5a0faca5785f893fa4eb9b9d4676f2404

      # Kakao OAuth2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: 6314ef9de4168d995d3c4c4c308f8fef
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: jte1OyJD8wDmQdKWjh3E6mRNjLrC91y2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI: https://apis.bangtal-boys.com/login/oauth2/code/kakao

