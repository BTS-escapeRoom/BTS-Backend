services:
  bts-backend-db:
    image: mysql
    environment:
      MYSQL_DATABASE: bts
      MYSQL_ROOT_HOST: root
      MYSQL_ROOT_PASSWORD: bangtal-boys
    networks:
      - bts-backend
    volumes:
      - bts-backend-db:/var/lib/mysql
      - bts-backend-db-ini:/etc/mysql/conf.d
    ports:
      - "33066:3306"
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 3

  bts-backend:
    image: ghcr.io/bts-escaperoom/bts-backend:${IMAGE_TAG}
    restart: always
    networks:
      - bts-backend
    ports:
      - "8881:8080"
    depends_on:
       bts-backend-db:
         condition: service_healthy


networks:
  bts-backend:
    driver: bridge
volumes:
  bts-backend-db:
    external: true
  bts-backend-db-ini:
    external: true
