services:
  bts-backend-db:
    image: mysql
    environment:
      MYSQL_DATABASE: bts
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: bangtal-boys
    networks:
      - bts-backend
    volumes:
      - bts-backend-db:/var/lib/mysql
      - bts-backend-db-ini:/etc/mysql/conf.d
    ports:
      - "33066:3306"
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 3

  bts-backend:
    image: ghcr.io/bts-escaperoom/bts-backend:${IMAGE_TAG}
    restart: always
    environment:
      # JWT Secret Key
      SPRING_SECURITY_JWT_SECRET-KEY: 37e5e6213096155c93ce0d832fc2f1f5a0faca5785f893fa4eb9b9d4676f2404

      # Kakao OAuth2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: 6314ef9de4168d995d3c4c4c308f8fef
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: jte1OyJD8wDmQdKWjh3E6mRNjLrC91y2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao

      # Naver OAuth2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_ID: 87XRcRkTrKm_jRmKqsVb
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_SECRET: XRsjyrij5R
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_REDIRECT_URI: http://localhost:8080/login/oauth2/code/naver

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://workstation.dork94.com:33066/bts?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: bangtal-boys

      # Optional: 추가 필요 시 Apple Key/Team ID 설정
      APPLE_KEY_ID: <your-apple-key-id>
      APPLE_TEAM_ID: <your-apple-team-id>
    networks:
      - bts-backend
    ports:
      - "8881:8080"
    depends_on:
       bts-backend-db:
         condition: service_healthy


networks:
  bts-backend:
    driver: bridge
volumes:
  bts-backend-db:
    external: true
  bts-backend-db-ini:
    external: true
