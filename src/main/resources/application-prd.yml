server:
  host: apis.bangtal-boys.com

spring:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            app-id: ${KAKAO_APP_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_image
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
            client-authentication-method: client_secret_post
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - profile_image
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI}
            client-name: Naver
            client-authentication-method: client_secret_post
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: default-client-secret
            scope: openid
            authorization-grant-type: authorization_code
            redirect-uri: ${APPLE_REDIRECT_URI}
            client-name: Apple
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-info-authentication-method: header
            user-name-attribute: response
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-name-attribute: sub
            jwk-set-uri: https://appleid.apple.com/auth/keys
            team-id: ${APPLE_TEAM_ID}
            key-id: ${APPLE_KEY_ID}
            bundle-id: ${APPLE_BUNDLE_ID}
            private-key: ${APPLE_PRIVATE_KEY}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

decorator:
  datasource:
    p6spy:
      enable-logging: false

springdoc:
  show-login-endpoint: true

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

logging:
  level:
    # 스프링 시큐리티 OAuth2 관련 로그를 상세하게 봅니다.
    org.springframework.security.oauth2: TRACE
    # HTTP 요청을 보내는 클라이언트(RestTemplate 등)의 로그를 봅니다.
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE # WebClient 사용 시
    # 아파치 HttpClient(실제 전송 라이브러리) 로그
    org.apache.http: DEBUG