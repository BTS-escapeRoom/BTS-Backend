config:
  type: aws-parameterstore:/config/bangtal-boys/prd/

server:
  host: apis.bangtal-boys.com

spring:
  config:
    import: ${config.type}
  security:
    jwt:
      secret-key: ${spring.security.jwt.secret-key}
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${spring.security.oauth2.client.registration.kakao.client-id}
            client-secret: ${spring.security.oauth2.client.registration.kakao.client-secret}
            scope:
            authorization-grant-type: authorization_code
            redirect-uri: ${spring.security.oauth2.client.registration.kakao.redirect-uri}
            client-name: Kakao
            client-authentication-method: client_secret_post
          naver:
            client-id: ${spring.security.oauth2.client.registration.naver.client-id}
            client-secret: ${spring.security.oauth2.client.registration.naver.client-secret}
            scope:
            authorization-grant-type: authorization_code
            redirect-uri: ${spring.security.oauth2.client.registration.naver.redirect-uri}
            client-name: Naver
            client-authentication-method: client_secret_post
          apple:
            client-id: ${spring.security.oauth2.client.registration.apple.client-id}
            scope: openid
            authorization-grant-type: authorization_code
            redirect-uri: ${spring.security.oauth2.client.registration.apple.redirect-uri}
            client-name: Apple
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-info-authentication-method: header
            user-name-attribute: response
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://appleid.apple.com/auth/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://appleid.apple.com/auth/keys
            team-id: ${spring.security.oauth2.client.provider.apple.team-id}
            key-id: ${spring.security.oauth2.client.provider.apple.key-id}
            private-key: ${spring.security.oauth2.client.provider.apple.private-key}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}

decorator:
  datasource:
    p6spy:
      enable-logging: false

springdoc:
  show-login-endpoint: true

kakao:
  admin-key: ${kakao.admin-key}